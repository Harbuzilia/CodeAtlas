name: OpenCode Quality Gates CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The harness is Windows-first (PowerShell hooks, CRLF history), so the
        # Windows leg is not optional — Linux-only CI hid Windows-only breakage.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate registry, context refs, frontmatter, skills, runtime
        run: npm run validate:all

      - name: Verify .opencode runtime mirror is generated from source
        run: npm run sync:check

      - name: Functional smoke test
        run: npm run smoke:functional

      - name: Routing evaluation
        run: npm run eval:routes

      - name: Secret leak scanner
        run: npm run scan:secrets
